<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>控制中心</title>
  <link rel="stylesheet" href="./assets/settings.css">
</head>
<body>
  <div id="settingsApp">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="mac-buttons">
          <div class="mac-btn close" id="btnClose"></div>
          <div class="mac-btn min"></div>
          <div class="mac-btn max" id="btnMax"></div>
        </div>
        <span class="header-title">🎯 控制中心</span>
      </div>
    </div>

    <div class="main-layout">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">看板分析</span>
        </div>
        <div class="nav-item" data-page="global">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">全局设置</span>
        </div>
        <div class="nav-item" data-page="personal">
          <span class="nav-icon">🎨</span>
          <span class="nav-label">个性化</span>
        </div>
        <div class="nav-item" data-page="terminal">
          <span class="nav-icon">💻</span>
          <span class="nav-label">终端</span>
        </div>
      </nav>

      <!-- Content Area -->
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>
  <script type="module" src="./src/settings/index.ts"></script>
</body>
</html>
