appId: com.janauto.floating-memo
productName: 浮窗备忘录
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # 正式分发需要 Apple Developer 证书:
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # hardenedRuntime: true
  # notarize: true
npmRebuild: true
